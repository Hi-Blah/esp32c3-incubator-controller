<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>Fused low-side DC power wiring</title><style>text{font-family:Arial,sans-serif;fill:#173b32;font-size:20px}.small{font-size:16px;fill:#48665c}.title{font-size:28px;font-weight:bold}.pin{font-size:18px;font-weight:bold}.wire{fill:none;stroke-width:4;stroke-linejoin:round}.red{stroke:#c64339}.ground{stroke:#263e48}.control{stroke:#2c70b7}.adc{stroke:#ba7b16}.return{stroke:#7b4eac}</style><rect width="100%" height="100%" fill="#f5f9f7"/><text x="30" y="42" class="title">DC power wiring · nonisolated low-side MOS modules</text><text x="30" y="72" class="small">Verify module labels and topology. Use a fuse and load-rated wires for each branch.</text><polyline points="250,245 300,245 300,130 350,130" class="wire red"/><polyline points="430,130 560,130" class="wire red"/><polyline points="300,245 300,400 350,400" class="wire red"/><polyline points="430,400 560,400" class="wire red"/><polyline points="250,325 270,325 270,650 520,650" class="wire ground"/><polyline points="560,230 490,230 490,620 520,620 520,650" class="wire ground"/><polyline points="560,500 540,500 540,650 520,650" class="wire ground"/><polyline points="570,670 550,670 550,650 520,650" class="wire ground"/><polyline points="800,130 930,130" class="wire red"/><polyline points="800,230 930,230" class="wire return"/><polyline points="800,400 930,400" class="wire red"/><polyline points="800,500 930,500" class="wire return"/><rect x="40" y="200" width="210" height="160" rx="12" fill="#fff" stroke="#83a497" stroke-width="2"/><text x="60" y="236" class="pin">24 V DC supply</text><text x="60" y="279" class="">+24 V / negative</text><text x="60" y="320" class="small">Load-rated output</text><rect x="350" y="106" width="80" height="48" rx="12" fill="#fff" stroke="#83a497" stroke-width="2"/><text x="364" y="138" class="pin">F1</text><rect x="350" y="376" width="80" height="48" rx="12" fill="#fff" stroke="#83a497" stroke-width="2"/><text x="364" y="408" class="pin">F2</text><rect x="560" y="100" width="240" height="160" rx="12" fill="#fff" stroke="#83a497" stroke-width="2"/><text x="585" y="155" class="pin">MOS module 1</text><text x="570" y="128" class="small">DC+</text><text x="570" y="240" class="small">DC-</text><text x="730" y="128" class="small">OUT+</text><text x="730" y="240" class="small">OUT-</text><text x="572" y="183" class="small">PWM: see signal diagram</text><rect x="930" y="100" width="230" height="160" rx="12" fill="#fff" stroke="#83a497" stroke-width="2"/><text x="950" y="155" class="pin">LED source 1</text><text x="950" y="195" class="small">Rated constant voltage</text><text x="950" y="128" class="pin">+</text><text x="950" y="240" class="small">− switched return</text><rect x="560" y="370" width="240" height="160" rx="12" fill="#fff" stroke="#83a497" stroke-width="2"/><text x="585" y="425" class="pin">MOS module 2</text><text x="570" y="398" class="small">DC+</text><text x="570" y="510" class="small">DC-</text><text x="730" y="398" class="small">OUT+</text><text x="730" y="510" class="small">OUT-</text><text x="572" y="453" class="small">PWM: see signal diagram</text><rect x="930" y="370" width="230" height="160" rx="12" fill="#fff" stroke="#83a497" stroke-width="2"/><text x="950" y="425" class="pin">LED source 2</text><text x="950" y="465" class="small">Rated constant voltage</text><text x="950" y="398" class="pin">+</text><text x="950" y="510" class="small">− switched return</text><rect x="570" y="585" width="250" height="115" rx="12" fill="#fff" stroke="#83a497" stroke-width="2"/><text x="590" y="620" class="pin">ESP32-C3</text><text x="590" y="653" class="">USB 5 V input</text><text x="590" y="681" class="small">Signal ground</text><rect x="930" y="585" width="230" height="115" rx="12" fill="#fff" stroke="#83a497" stroke-width="2"/><text x="950" y="620" class="pin">USB 5 V source</text><text x="950" y="655" class="small">No 24 V connection</text><polyline points="820,630 930,630" class="wire control"/><circle cx="520" cy="650" r="7" fill="#263e48"/><text x="325" y="691" class="small">Common ground star</text><text x="30" y="744" class="pin">OUT- is not common GND. Never bridge the two switched returns.</text><text x="30" y="776" class="small">High-current load returns must not pass through the ESP32 or a breadboard.</text></svg>