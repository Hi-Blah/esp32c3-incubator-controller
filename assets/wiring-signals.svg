<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="740" viewBox="0 0 1180 740"><title>Default signal wiring</title><style>text{font-family:Arial,sans-serif;fill:#173b32;font-size:20px}.small{font-size:16px;fill:#48665c}.title{font-size:28px;font-weight:bold}.pin{font-size:18px;font-weight:bold}.wire{fill:none;stroke-width:4;stroke-linejoin:round}.red{stroke:#c64339}.ground{stroke:#263e48}.control{stroke:#2c70b7}.adc{stroke:#ba7b16}.return{stroke:#7b4eac}</style><rect width="100%" height="100%" fill="#f5f9f7"/><text x="30" y="42" class="title">Default signal wiring · ESP32-C3 SuperMini</text><text x="30" y="70" class="small">Connection guide only; pin labels are not physical header positions.</text><rect x="420" y="100" width="330" height="540" rx="12" fill="#e6f0eb" stroke="#83a497" stroke-width="2"/><text x="470" y="620" class="title">ESP32-C3</text><rect x="30" y="105" width="280" height="105" rx="12" fill="#fff" stroke="#83a497" stroke-width="2"/><text x="50" y="136" class="pin">SSD1306 OLED</text><text x="50" y="169" class="">SDA / SCL · 3V3 / GND</text><polyline points="310,140 420,140" class="wire control"/><polyline points="310,180 420,180" class="wire control"/><text x="435" y="143" class="pin">GPIO6  SDA</text><text x="435" y="183" class="pin">GPIO5  SCL</text><rect x="30" y="245" width="280" height="100" rx="12" fill="#fff" stroke="#83a497" stroke-width="2"/><text x="50" y="278" class="pin">DHT11 module</text><text x="50" y="315" class="">DATA · 3V3 / GND</text><polyline points="310,285 420,285" class="wire control"/><text x="435" y="290" class="pin">GPIO21 DATA</text><rect x="30" y="380" width="280" height="100" rx="12" fill="#fff" stroke="#83a497" stroke-width="2"/><text x="50" y="413" class="pin">LDR module 1</text><text x="50" y="450" class="small">AO · 3V3 / GND; DO unused</text><polyline points="310,420 420,420" class="wire adc"/><text x="435" y="425" class="pin">GPIO0  ADC1</text><rect x="30" y="515" width="280" height="100" rx="12" fill="#fff" stroke="#83a497" stroke-width="2"/><text x="50" y="548" class="pin">LDR module 2</text><text x="50" y="585" class="small">AO · 3V3 / GND; DO unused</text><polyline points="310,555 420,555" class="wire adc"/><text x="435" y="560" class="pin">GPIO1  ADC1</text><rect x="865" y="145" width="285" height="140" rx="12" fill="#fff" stroke="#83a497" stroke-width="2"/><text x="885" y="180" class="pin">MOS channel 1</text><text x="885" y="220" class="">PWM+ / trigger input</text><text x="885" y="260" class="small">Signal GND → common GND</text><polyline points="750,220 865,220" class="wire control"/><text x="595" y="225" class="pin">GPIO4</text><rect x="865" y="325" width="285" height="140" rx="12" fill="#fff" stroke="#83a497" stroke-width="2"/><text x="885" y="360" class="pin">MOS channel 2</text><text x="885" y="400" class="">PWM+ / trigger input</text><text x="885" y="440" class="small">Signal GND → common GND</text><polyline points="750,400 865,400" class="wire control"/><text x="595" y="405" class="pin">GPIO7</text><rect x="865" y="525" width="285" height="100" rx="12" fill="#fff" stroke="#83a497" stroke-width="2"/><text x="885" y="560" class="pin">Optional page button</text><text x="885" y="597" class="small">Button → GND; pull-up</text><polyline points="750,570 865,570" class="wire control"/><text x="595" y="575" class="pin">GPIO10</text><text x="30" y="677" class="">Sensor supply: 3.3 V only. All signal grounds share the verified common ground.</text><text x="30" y="710" class="small">Keep 24 V away from GPIO/AO; MOS load wiring is shown separately.</text></svg>